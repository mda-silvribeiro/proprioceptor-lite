# OpenSSF Scorecard: an automated, publishable read on the repository's own
# supply-chain posture (branch protection, pinned Actions, token permissions,
# CI-test presence, dangerous-workflow patterns). Produces the badge linked from
# the README and uploads results to the code-scanning dashboard.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "31 6 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Upload findings to the code-scanning dashboard.
      security-events: write
      # Publish results to the public OpenSSF dashboard via OIDC.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
