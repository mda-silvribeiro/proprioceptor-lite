# Dependabot triage: enable auto-merge for low-risk updates, escalate the rest.
#
# Rationale. This repository ships zero runtime dependencies (CLAUDE.md hard
# rule); every Dependabot PR therefore touches dev tooling (TypeScript, Vitest,
# Playwright, workers-types) or a pinned GitHub Action SHA. Those two classes are
# low blast-radius, so the triage rule is deterministic rather than model-based:
# semver-patch and semver-minor updates are marked for auto-merge; every
# semver-major bump is labelled and left for a human, because a major is the one
# case that can change tool behaviour, a lockfile resolution, or an Action's API.
#
# "Auto-merge" here is GitHub-native: `gh pr merge --auto` arms the merge and the
# platform completes it only after every required status check on the protected
# base branch reports success. A red CI run blocks the merge with no further
# action. This safety property depends on branch protection actually marking the
# ci gates as required for the exact settings and the
# one-time `needs-human-review` label creation this workflow relies on.
name: dependabot-auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Dependabot update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Arm auto-merge for patch and minor updates
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' ||
              steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
        run: |
          # --squash keeps main linear; --auto defers the merge until required
          # checks pass. This step never merges on its own.
          gh pr merge --auto --squash "$PR_URL"
          gh pr comment "$PR_URL" --body "Auto-merge armed: \`${DEP_NAMES}\` is a \`${UPDATE_TYPE}\` update to a \`${DEP_TYPE}\` dependency. GitHub will squash-merge this once every required status check on the protected branch reports success. No human review is required for a patch/minor bump in a zero-runtime-dependency project; a failing check blocks the merge automatically.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

      - name: Escalate major updates to a human
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-major' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          # Create the label if the repo does not have it yet, so the first major
          # bump on a fresh clone does not fail on a missing label before the
          # escalation comment is posted. --force is idempotent.
          gh label create needs-human-review \
            --color D93F0B \
            --description "Dependabot major bump held for maintainer review" \
            --force
          gh pr edit "$PR_URL" --add-label "needs-human-review"
          gh pr comment "$PR_URL" --body "Held for human review: \`${DEP_NAMES}\` is a \`version-update:semver-major\` bump. Major versions can change tool behaviour or an Action's API contract, so this project escalates every major to a maintainer rather than auto-merging it. Review the changelog, confirm the CI gates (typecheck, unit, web) are green, then merge manually.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
